name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake pkg-config \
            qtbase5-dev qtmultimedia5-dev libqt5serialport5-dev \
            qttools5-dev qttools5-dev-tools libqt5sql5-sqlite \
            libboost-dev libfftw3-dev libhamlib-dev libhamlib-utils \
            libusb-1.0-0-dev libudev-dev dpkg-dev

      - name: Configure
        # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4.x accept the old
        # cmake_minimum_required(2.8.10) in CMakeLists.txt.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test (simulate and decode an FT8 signal)
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/build/ft8sim" "CQ K1ABC FN42" 1500.0 0.0 0.1 1.0 0 1 -12
          "$GITHUB_WORKSPACE/build/jt9" -8 -d 3 000000_000001.wav | tee decode.txt
          grep -q "CQ K1ABC FN42" decode.txt

      - name: Build .deb package
        working-directory: build
        run: |
          cpack -G DEB
          deb=$(ls ft8-go_*.deb)
          echo "DEB=build/$deb" >> "$GITHUB_ENV"
          dpkg-deb --info "$deb"

      - name: Test-install .deb
        run: |
          sudo apt-get install -y "./$DEB"
          dpkg -s ft8-go | grep -E '^(Package|Version|Status|Depends):'
          for f in wsjtx jt9 rigctl-wsjtx rigctld-wsjtx; do test -x "/usr/bin/$f"; done

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: ft8-go-deb-ubuntu-24.04-amd64
          path: build/ft8-go_*.deb
          if-no-files-found: error
